name: Starter checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.4
      - run: npm ci
      - run: npm run check
      - name: Verify generated ABI is committed
        run: git diff --exit-code -- shared/contract.ts
      - name: Read deployed Sepolia record (no private key)
        env:
          RPC_URL: https://ethereum-sepolia-rpc.publicnode.com
        run: npm run read
